name: Build GromVisuals

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gromvisuals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Minecraft 1.21.11 · Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Select remapped runtime JAR (exclude sources and dev JARs)
        if: success()
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'GromVisuals-Minecraft-1.21.11-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          if [[ -z "$jar_path" ]]; then
            echo "No remapped runtime JAR found in build/libs" >&2
            exit 1
          fi
          echo "MOD_JAR=$jar_path" >> "$GITHUB_ENV"

      - name: Upload distributable mod JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: GromVisuals-Minecraft-1.21.11
          path: ${{ env.MOD_JAR }}
          if-no-files-found: error
          retention-days: 30

      - name: Save test reports and diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: GromVisuals-build-diagnostics
          path: |
            build/reports/**
            build/test-results/**
            **/hs_err_pid*.log
            ~/.gradle/daemon/*/daemon-*.out.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
